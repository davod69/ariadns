name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.24" }
      - run: go test ./...
      - name: Build
        run: |
          mkdir dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X ariadns/internal/version.Version=${GITHUB_REF_NAME}" \
              -o dist/ariadns_linux_$arch ./cmd/ariadns
          done
          (cd dist && sha256sum ariadns_linux_* > checksums.txt)
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
